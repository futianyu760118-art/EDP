# EDP staging 单写入口（W5-T16 / W4-T14 后续项）——挂载为
# /usr/local/etc/haproxy/haproxy.cfg（只读）。
#
# 角色：api/worker 的 EDP_DATABASE_URL 统一指向 haproxy:5432；HAProxy 按 Patroni
# REST API 健康检查自动跟随主库——仅 leader 的 GET /primary 返回 200，replica
# 返回 503 被摘除；switchover/failover 后流量自动切到新主，无需人工改配置。
#
# 检查口径：inter 1s rise 1 fall 2 → 失效摘除 ≈2s、恢复回挂 ≈1s；httpchk 请求
# 发往 8008（Patroni restapi），转发流量仍走 5432（server 行 port 8008）。
# retries 3 + option redispatch：连接失败时换健康 server 重试（切换窗口内
# 旧主尚未被摘除时兜底）。
#
# 排查（容器内）：echo "show stat" | socat /var/run/haproxy/admin.sock stdio

global
  maxconn 200
  # 镜像默认以 haproxy 用户运行：compose 以 tmpfs 提供可写 /var/run/haproxy
  stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
  mode tcp
  # 数据库长连接：client/server 放宽到 1h；连接/检查超时秒级
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout check 2s

frontend pg
  bind *:5432
  default_backend patroni_primary

backend patroni_primary
  mode tcp
  retries 3
  option redispatch
  # 健康检查 = Patroni REST API：GET /primary，仅 leader 200（replica 503）
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 1s rise 1 fall 2
  server patroni1 patroni1:5432 check port 8008
  server patroni2 patroni2:5432 check port 8008
