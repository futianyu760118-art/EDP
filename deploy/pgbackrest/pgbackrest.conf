# EDP staging pgbackrest 配置（T14 / EDP-021 建；W5-T14 / EDP-031 前置迁 S3）
# 仓库形态：S3（MinIO，bucket edp-backups；内网明文 http）。
#   注意（实测 2026-09-21，pgbackrest 2.59.1）：repo1-s3-endpoint 必须带 http:// 前缀才是明文；
#   仅 repo1-s3-verify-ssl=n 只跳过证书校验、仍走 TLS（报 TLS wrong version number）。
# 拷贝模式：备份在 patroni 容器内本地执行（数据目录与 repo 同容器可达），
#   docker compose exec patroni1 pgbackrest --stanza=edp stanza-create        # 首次建 stanza（幂等）
#   docker compose exec patroni1 pgbackrest --stanza=edp --type=full backup   # 全量备份
#   docker compose exec pgbackrest pgbackrest info                            # 查看 repo 备份集
# 降级预案：MinIO 不可用时回退 W4 本地 repo 卷（backups 卷仍挂载于 /pgbackrest）——
#   将 [global] 的 repo1 行改回：repo1-path=/pgbackrest/repo 并删除 repo1-s3-*/repo1-type
#   （W4 本地全量备份集仍留在卷内；详见 docs/demo/w5-drills.md T14 降级段）。

[global]
repo1-type=s3
repo1-path=/pgbackrest/edp
repo1-retention-full=2
repo1-s3-endpoint=http://minio:9000
repo1-s3-bucket=edp-backups
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-s3-verify-ssl=n
# 演示值（与 compose minio 服务 MINIO_ROOT_USER 一致）；生产经 secret manager 注入
repo1-s3-key=edp_minio
# S3 密钥经环境变量注入（W6 安全剔除：配置文件不再含密钥）：
#   PGBACKREST_REPO1_S3_KEY_SECRET（compose 从本地 .env 注入，勿入库）
process-max=2
log-level-console=info
log-level-file=off

# WAL 归档：archive-push 同步写 S3 repo；量级增大后可打开 archive-async=y。
# archive-async=y

[edp]
# 本地模式：备份经 docker compose exec patroni1 执行，pg1 即本机（数据目录/套接字）
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-user=postgres
