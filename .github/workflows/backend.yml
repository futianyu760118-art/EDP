name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run pytest -m "not integration"
      - run: uv run pytest -m integration

  migrate-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edp_migrator
          POSTGRES_PASSWORD: edp_dev
          POSTGRES_DB: edp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://edp_migrator:edp_dev@localhost:5432/edp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head

  contract-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python scripts/export_openapi.py --check

  # V1.2 T07：域契约包 JSON Schema 门禁（contracts/**/*.schema.json）
  schema-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --with jsonschema python scripts/validate_contract_schemas.py
