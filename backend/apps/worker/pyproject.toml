[project]
name = "edp-worker"
version = "0.1.0"
description = "EDP Outbox Worker（事件分发）"
requires-python = ">=3.12"
dependencies = [
    "edp-api",
    "aiokafka>=0.12",
]

[tool.uv.sources]
edp-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edp_worker"]
