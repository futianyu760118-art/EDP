[alembic]
# migrations directory (relative to this ini file)
script_location = migrations
# sqlalchemy.url is resolved in migrations/env.py, priority:
#   alembic -x database_url=... > env EDP_DATABASE_URL > env DATABASE_URL
#   > default postgresql+asyncpg://edp_migrator:edp_dev@localhost:15432/edp (local tools db)
sqlalchemy.url =
# version_locations (multi-dir, single linear chain); %(here)s = dir of this ini file.
# NOTE: must live here (not env.py) - ScriptDirectory reads it before env.py is loaded.
version_locations = %(here)s/migrations/versions/platform %(here)s/migrations/versions/master %(here)s/migrations/versions/event %(here)s/migrations/versions/misc
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
